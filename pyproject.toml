[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md-split-diagnostics"
version = "0.1.0"
description = "Check whether a train/test split of time-correlated MD data is defensible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nina Phatak" }]
keywords = ["molecular dynamics", "machine learning", "train/test split", "autocorrelation", "data leakage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
# Only needed for load_alanine_dipeptide and scripts/alanine_dipeptide_demo.py.
examples = [
    "mdshare>=0.4",
    # mdshare 0.4.2 imports these without declaring them; pkg_resources was removed in setuptools 81.
    "pyyaml",
    "setuptools<81",
]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/ninaphatak/md-split-diagnostics"
Issues = "https://github.com/ninaphatak/md-split-diagnostics/issues"

[tool.setuptools]
packages = ["md_split_diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
