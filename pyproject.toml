[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md-split-diagnostics"
version = "0.1.0"
description = "Check whether a train/test split of time-correlated MD data is defensible."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "mdshare>=0.4",
    # mdshare 0.4.2 imports these without declaring them; pkg_resources was removed in setuptools 81.
    "pyyaml",
    "setuptools<81",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["md_split_diagnostics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
